<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#1A150F"/>
      <stop offset="1" stop-color="#0C0907"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-200%" width="120%" height="500%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- live seismograph trace along the base -->
  <g filter="url(#glow)" opacity="0.65">
    <path d="M0 596 H430 L470 580 L505 470 L525 596 L640 596 L690 360 L735 660 L775 596 H1200"
      stroke="#E0521B" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- LIVE pill -->
  <rect x="80" y="78" width="150" height="44" rx="22" fill="#E0521B"/>
  <circle cx="108" cy="100" r="6.5" fill="#fff"/>
  <text x="126" y="108" font-family="Sora, Arial, sans-serif" font-size="21" font-weight="800" fill="#fff" letter-spacing="3">LIVE</text>

  <!-- wordmark -->
  <text x="74" y="300" font-family="Sora, Arial, sans-serif" font-size="164" font-weight="800" fill="#F4EEE3" letter-spacing="-5">LIND<tspan fill="#E0521B">O</tspan>L</text>

  <!-- tagline -->
  <text x="82" y="362" font-family="Sora, Arial, sans-serif" font-size="39" font-weight="600" fill="#B6AC9C">Southern Mindanao · Live Earthquake Watch</text>

  <!-- feature row -->
  <text x="82" y="448" font-family="Sora, Arial, sans-serif" font-size="30" font-weight="600" fill="#E7DFD2">Live USGS quakes<tspan fill="#E0521B" font-weight="800">  ·  </tspan>Aftershock alerts<tspan fill="#E0521B" font-weight="800">  ·  </tspan>Citizen reports<tspan fill="#E0521B" font-weight="800">  ·  </tspan>Safety</text>

  <!-- url -->
  <text x="82" y="540" font-family="Sora, Arial, sans-serif" font-size="36" font-weight="800" fill="#E0521B" letter-spacing="1">lindol.app</text>
</svg>
